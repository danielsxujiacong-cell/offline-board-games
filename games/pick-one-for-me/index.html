<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5"><title>今天纠结什么？</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="feedback.css">
  <style>.result-actions .keep{flex-basis:100%;min-height:64px;font-size:18px;font-weight:700;box-shadow:0 12px 30px rgba(238,118,88,.2)}body.in-tool .brand{visibility:hidden}.decision-view[data-view="food"] .decision-actions{display:none}.decision-view[data-view="food"] .decision-stage>.decide-action,.tool-idle-action{width:min(100%,440px);height:72px;justify-content:center;font-size:19px;box-shadow:0 16px 34px rgba(28,28,30,.14)}.decision-view[data-view="food"] .decision-stage>.decide-action span{display:none}.decision-view[data-view="food"] .decision-stage>.decide-action:active{transform:scale(.97)}.decision-view[data-view="food"] .food-edit-options,.tool-edit-options{width:auto;min-width:190px;margin-top:18px;background:#efefec;color:#777;border-radius:14px;padding:12px 18px;text-align:center}.decision-view[data-view="food"] .food-edit-options span,.tool-edit-options span{font-size:20px;margin-left:5px}.decision-view[data-view="food"].food-state-spinning .idle-decide,.decision-view[data-view="food"].food-state-spinning .food-edit-options,.decision-view[data-view="food"].food-state-result .idle-decide,.decision-view[data-view="food"].food-state-result .food-edit-options,.tool-state-spinning .tool-idle-action,.tool-state-spinning .tool-edit-options,.tool-state-result .tool-idle-action,.tool-state-result .tool-edit-options{display:none}.decision-view[data-view="food"].food-state-spinning .result-panel .result-actions,.decision-view[data-view="food"].food-state-spinning .result-panel .result-label,.tool-state-spinning .result-panel .result-actions,.tool-state-spinning .result-panel .result-label{display:none}.decision-view[data-view="food"].food-state-spinning .result-panel,.decision-view[data-view="food"].food-state-result .result-panel,.tool-state-spinning .result-panel,.tool-state-result .result-panel{display:flex}.tool-state-spinning .number-result,.tool-state-result .number-result{display:none}.number-sheet-fields{display:grid;gap:12px;margin-bottom:16px}.number-sheet-fields label{display:grid;gap:6px;color:#777}.number-sheet-fields input{border:1px solid #e5e5e1;background:#fff;border-radius:14px;padding:14px}</style>
</head>
<body>
<main class="app-shell">
  <header class="topbar"><button class="icon-button back-button" aria-label="返回首页" hidden>‹</button><div class="brand"><span class="brand-dot"></span><span>Pick one</span></div><button class="text-button history-button">历史</button></header>
  <section class="view active home-view" data-view="home"><div class="hero"><p class="eyebrow">轻松一点</p><h1>今天纠结什么？</h1><p class="hero-copy">把小小的选择交给一点运气，马上开始下一件事。</p></div><div class="choice-grid"><button class="choice-card" data-open="food"><span class="choice-icon">🍜</span><span><strong>吃什么</strong><small>今天这顿，交给运气。</small></span><span class="arrow">→</span></button><button class="choice-card" data-open="decide"><span class="choice-icon decide-icon">✦</span><span><strong>帮我决定</strong><small>输入几个选项，我替你选。</small></span><span class="arrow">→</span></button><button class="choice-card" data-open="number"><span class="choice-icon number-icon">123</span><span><strong>随机数字</strong><small>从一个范围里抽一个数字。</small></span><span class="arrow">→</span></button></div></section>
  <section class="view decision-view food-state-idle" data-view="food"><div class="decision-head"><p class="eyebrow">今天吃什么</p><h2>今天吃什么？</h2></div><div class="decision-stage"><button class="primary-button decide-action idle-decide" data-action="food">替我决定</button><button class="food-edit-options" id="open-food-sheet">编辑选项 · <strong id="food-count">8</strong> 项 <span>›</span></button><div class="result-panel" aria-live="polite"></div></div></section>
  <section class="view decision-view tool-state-idle" data-view="decide"><div class="decision-head"><p class="eyebrow">交给运气</p><h2>帮我决定</h2></div><div class="decision-stage"><button class="primary-button tool-idle-action decide-action" data-action="decide">替我决定</button><button class="tool-edit-options" id="open-decide-sheet">编辑选项 · <strong id="decide-count">4</strong> 项 <span>›</span></button><div class="result-panel" aria-live="polite"></div></div></section>
  <section class="view decision-view number-view tool-state-idle" data-view="number"><div class="decision-head"><p class="eyebrow">随机数字</p><h2>随机数字</h2></div><div class="decision-stage"><button class="primary-button tool-idle-action decide-action" data-action="number">抽一个数字</button><button class="tool-edit-options" id="open-number-sheet">范围 · <strong id="number-range-label">1～100</strong> <span>›</span></button><div class="number-result"><span>?</span></div><div class="result-panel" aria-live="polite"></div></div></section>
</main>
<section class="sheet-backdrop" id="sheet-backdrop" hidden></section><section class="bottom-sheet" id="food-sheet" hidden aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title">编辑食物</h2><button class="icon-button" id="close-food-sheet">×</button></div><div class="sheet-chips" id="food-options"></div><div class="sheet-add"><input id="food-input" maxlength="24" placeholder="添加一种食物……"><button id="food-add">添加</button></div><button class="restore-button" id="food-restore">↺ 全部恢复默认食物</button></section>
<section class="bottom-sheet" id="decide-sheet" hidden aria-labelledby="decide-sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="decide-sheet-title">编辑选项</h2><button class="icon-button close-tool-sheet">×</button></div><div class="sheet-chips" id="decide-options"></div><div class="sheet-add"><input id="decide-input" maxlength="40" placeholder="输入一个选项……"><button id="decide-add">添加</button></div></section>
<section class="bottom-sheet" id="number-sheet" hidden aria-labelledby="number-sheet-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="number-sheet-title">设置范围</h2><button class="icon-button close-tool-sheet">×</button></div><div class="number-sheet-fields"><label>最小值<input id="min-number" type="number" value="1"></label><label>最大值<input id="max-number" type="number" value="100"></label></div><button class="primary-button" id="save-number-range">保存范围</button></section>
<section class="confirm-modal" id="confirm-modal" hidden><div class="confirm-card"><p class="eyebrow">决定好了</p><div class="confirm-icon" id="confirm-icon">🍗</div><h2 id="confirm-value">炸鸡</h2><p>今天就它了。</p><div class="confirm-actions"><button class="primary-button" id="finish-confirm">完成 <span>✓</span></button><button class="secondary-button" id="home-confirm">返回首页</button><button class="poster-button" id="make-poster">生成天意海报 <span>↗</span></button></div></div></section>
<section class="poster-modal" id="poster-modal" hidden><div class="poster-card"><div class="poster-head"><strong>天意海报</strong><button class="icon-button" id="close-poster">×</button></div><canvas id="poster-canvas" width="1080" height="1440"></canvas><div class="poster-actions"><button class="primary-button" id="save-poster">保存图片 <span>↓</span></button><button class="secondary-button" id="share-poster">分享</button><button class="text-button" id="new-copy">换一句文案</button></div></div></section>
<section class="history-drawer" hidden><div class="drawer-head"><h2>最近决定</h2><button class="icon-button close-history">×</button></div><div id="history-list"></div></section>
<script>const closeToolButton=document.querySelector('.close-tool-sheet');if(closeToolButton&&!closeToolButton.forEach)closeToolButton.forEach=callback=>callback(closeToolButton);</script>
<script src="app.js"></script><script>(function(){const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],r=JSON.parse(localStorage.getItem('pickone-range')||'null')||{min:1,max:100};q('#min-number').value=r.min;q('#max-number').value=r.max;function close(){qa('.bottom-sheet').forEach(s=>s.hidden=true);q('#sheet-backdrop').hidden=true}qa('.close-tool-sheet').forEach(b=>b.onclick=close);q('#open-decide-sheet').onclick=()=>{q('#decide-sheet').hidden=false;q('#sheet-backdrop').hidden=false;renderChips('decide')};q('#decide-add').onclick=()=>add('decide',q('#decide-input'));q('#decide-input').onkeydown=e=>{if(e.key==='Enter')add('decide',e.target)};q('#open-number-sheet').onclick=()=>{q('#number-sheet').hidden=false;q('#sheet-backdrop').hidden=false};q('#save-number-range').onclick=()=>{const min=Number(q('#min-number').value),max=Number(q('#max-number').value);if(!Number.isInteger(min)||!Number.isInteger(max)||min>=max){showToast('请输入有效的整数范围');return}localStorage.setItem('pickone-range',JSON.stringify({min,max}));updateFoodCount();close()};qa('.decide-action').forEach(b=>b.onclick=()=>b.dataset.action==='number'?pickNumber():pick(b.dataset.action));q('#finish-confirm').onclick=finishConfirm;q('#home-confirm').onclick=()=>{q('#confirm-modal').hidden=true;showView('home')};q('#make-poster').onclick=openPoster;q('#close-poster').onclick=()=>q('#poster-modal').hidden=true;q('#save-poster').onclick=savePoster;q('#new-copy').onclick=()=>{state.copyIndex=randomIndex(COPY.length);drawPoster()};q('#share-poster').onclick=sharePoster;if(!navigator.share)q('#share-poster').hidden=true;updateFoodCount();renderChips('decide')})();</script>
</body><script src="../../assets/home-link.js"></script></html>
