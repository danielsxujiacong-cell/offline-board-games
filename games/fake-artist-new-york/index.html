<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4efe7"><title>伪艺术家纽约行</title>
  <style>
    :root{--paper:#f4efe7;--ink:#20201e;--muted:#706b63;--line:#d8d0c5;--accent:#c9573e;--true:#2d765d;--false:#a8473b}*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}button{border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-weight:700;min-height:56px;padding:14px 20px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button:disabled{background:#c9c2b8;cursor:not-allowed;transform:none}.app{width:min(100%,520px);min-height:calc(100vh - 40px);margin:auto;display:flex;flex-direction:column}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0}.brand{margin:0 0 12px;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.16em}h1{margin:0 0 14px;font-size:clamp(38px,12vw,64px);line-height:1.05;letter-spacing:-.08em}h2{margin:0 0 10px;font-size:30px;letter-spacing:-.06em}p{line-height:1.6}.subtle{color:var(--muted);margin:0 0 26px}.eyebrow{color:var(--muted);font-size:14px;margin:0 0 8px}.actions{display:grid;gap:12px;margin-top:24px}.button-secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.count-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 6px}.count-grid button{min-height:50px;padding:8px 4px;background:transparent;color:var(--ink);border:1px solid var(--line)}.count-grid button.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.player-list{display:grid;gap:10px;margin:16px 0}.player{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.28);font-size:18px;font-weight:700}.player:not(.seen){cursor:pointer}.player.seen{color:var(--muted)}.check{color:var(--true);font-size:14px}.notice{padding:24px 18px;border:1px solid var(--line);border-radius:18px;text-align:center;background:rgba(255,255,255,.3)}.notice strong{display:block;font-size:24px;margin-bottom:8px}.identity{padding:26px 20px;border-radius:20px;border:2px solid var(--line);text-align:center}.identity.true{border-color:var(--true);background:#e9f2ec}.identity.false{border-color:var(--false);background:#f7e8e4}.role{margin:0 0 22px;font-size:30px;font-weight:800;letter-spacing:-.06em}.role.true{color:var(--true)}.role.false{color:var(--false)}.answer{margin:8px 0 0;font-size:27px;font-weight:800}.category{margin:0;font-size:18px}.public-card{padding:24px 20px;border:1px solid var(--line);border-radius:18px;background:#fffaf3}.public-category{margin:4px 0 22px;font-size:36px;font-weight:800}.rule{color:var(--muted);font-size:15px;margin:0}.center{text-align:center}.top-space{justify-content:flex-start;padding-top:6vh}.error{color:var(--false);font-size:14px;margin-top:12px}@media (min-height:700px) and (max-width:520px){.screen{padding-bottom:8vh}}
  </style>
</head>
<body><main class="app" id="app" aria-live="polite"></main>
<script type="module">
import { WORDS } from './data/words.js';
const app=document.querySelector('#app');const state={screen:'home',players:4,prompt:null,fakePlayer:null,seen:new Set(),activePlayer:null,error:''};const pick=a=>a[Math.floor(Math.random()*a.length)];const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function startGame(){if(!WORDS.length){state.error='词库为空，请先在 data/words.js 添加题目。';render();return}state.prompt=pick(WORDS);state.fakePlayer=Math.floor(Math.random()*state.players)+1;state.seen=new Set();state.activePlayer=null;state.error='';state.screen='players';render()}
function newGame(){state.screen='home';state.prompt=null;state.seen=new Set();state.activePlayer=null;state.error='';render()}function showIdentity(p){state.activePlayer=p;state.screen='guard';render()}function reveal(){state.screen='identity';render()}function confirmSeen(){state.seen.add(state.activePlayer);state.activePlayer=null;state.screen='players';render()}
function playerRows(){return Array.from({length:state.players},(_,i)=>{const p=i+1,s=state.seen.has(p);return `<button class="player ${s?'seen':''}" ${s?'disabled':''} data-player="${p}"><span>玩家 ${p}</span><span class="check">${s?'✓ 已查看':'点击查看'}</span></button>`}).join('')}
function render(){if(state.screen==='home')app.innerHTML=`<section class="screen"><p class="brand">A FAKE ARTIST GOES TO NEW YORK</p><h1>伪艺术家<br>纽约行</h1><p class="subtle">把手机依次传给每位玩家，确认没人偷看后再查看身份。</p><p class="eyebrow">选择玩家人数</p><div class="count-grid">${[4,5,6,7,8].map(n=>`<button class="${state.players===n?'selected':''}" data-count="${n}">${n} 人</button>`).join('')}</div><div class="actions"><button data-action="start">开始游戏</button></div>${state.error?`<p class="error">${esc(state.error)}</p>`:''}</section>`;
if(state.screen==='players')app.innerHTML=`<section class="screen top-space"><p class="brand">身份查看</p><h2>请依次查看身份</h2><p class="subtle">点击自己的编号。看完后请点击「我记住了」，身份会立即隐藏。</p><div class="player-list">${playerRows()}</div><div class="actions"><button data-action="public" ${state.seen.size===state.players?'':'disabled'}>开始作画</button><button class="button-secondary" data-action="new">重新开一局</button></div></section>`;
if(state.screen==='guard')app.innerHTML=`<section class="screen center"><div class="notice"><strong>玩家 ${state.activePlayer}</strong><p>确认周围没人偷看</p><button data-action="reveal">点击查看身份</button></div></section>`;
if(state.screen==='identity'){const fake=state.activePlayer===state.fakePlayer;app.innerHTML=`<section class="screen center"><div class="identity ${fake?'false':'true'}"><p class="role ${fake?'false':'true'}">你是${fake?'假':'真'}艺术家</p><p class="category">类别：${esc(state.prompt.category)}</p><p class="answer">具体词：${fake?'？？？':esc(state.prompt.word)}</p></div><div class="actions"><button data-action="remember">我记住了</button></div></section>`}
if(state.screen==='public')app.innerHTML=`<section class="screen top-space"><p class="brand">公共页面</p><div class="public-card"><p class="eyebrow">本局类别</p><p class="public-category">${esc(state.prompt.category)}</p><p class="rule">每人每轮只能画一笔，共画两轮，然后投票找出假艺术家。</p></div><div class="actions"><button data-action="round">开始本轮</button><button class="button-secondary" data-action="new">重新开一局</button></div></section>`;bind()}
function bind(){app.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{state.players=Number(b.dataset.count);render()});app.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>showIdentity(Number(b.dataset.player)));app.querySelector('[data-action="start"]')?.addEventListener('click',startGame);app.querySelector('[data-action="reveal"]')?.addEventListener('click',reveal);app.querySelector('[data-action="remember"]')?.addEventListener('click',confirmSeen);app.querySelector('[data-action="public"]')?.addEventListener('click',()=>{state.screen='public';render()});app.querySelector('[data-action="new"]')?.addEventListener('click',newGame);app.querySelector('[data-action="round"]')?.addEventListener('click',()=>alert('本轮开始：请把手机放回公共位置。'))}render();
</script><script src="../../assets/home-link.js"></script></body></html>
